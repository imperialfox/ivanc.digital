# ivanc.digital site settings. Plain-language options you can edit by hand.

title: ivanc.digital
description: Creative partner for brands and businesses through photo and video.
url: "https://ivanc.digital"
# Empty because the site is served from the custom domain ivanc.digital (see CNAME).
# Only if you ever serve it from imperialfox.github.io/ivanc.digital instead, set this to "/ivanc.digital".
baseurl: ""

# Site version. Used for cache busting (?v=...) on CSS and JS. Keep in step with CHANGELOG.md.
version: "0.2.30"

# Maintenance mode for Home (0.2.30).
# true  = Home shows only the wordmark, the motto, a short "being updated" line and the social links.
#         The work grid, gallery, index list and the "Work" menu link are hidden. About, Contact and
#         the Beth & Kyle proposal are not affected.
# false = the full Home comes back exactly as it was. Change this one word to switch.
maintenance: true

# Scroll effects (0.2.0): spinning scroll button that turns into back-to-top, soft fade-ins
# as you scroll, and the draggable cubes on Home. Set to false to switch them all off.
scroll_effects: true

# Your logo, fixed at the top left of every page in place of the "ivanc.digital" text in the nav.
# Set to false to remove it (the text comes back).
pinned_logo: true

# The motto. It appears on Home (under the big wordmark) and on Contact.
motto_lead: "Creative partner"
motto_rest: "for brands and businesses through photo and video"

# Big animated wordmark.
# false = the wordmark is live text in Instrument Serif (default for now).
# true  = play the exported loop instead. Needs these files in assets/images/wordmark/:
#   wordmark-light.mp4, wordmark-light.webm, wordmark-dark.mp4, wordmark-dark.webm,
#   wordmark-light-poster.webp, wordmark-dark-poster.webp
wordmark_video: false

# Film grain over the top of the Home page (only used with the live-text wordmark).
# false = off (current). true = on. Change this one word to toggle it.
grain: false

# Privacy-friendly analytics (Plausible). Leave empty for none.
plausible_domain: ""

# Each piece of work is a small file in _projects/ and gets its own page.
collections:
  projects:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Project pages: use the project layout and load their own stylesheet and script.
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
      page_css: project.css
      page_js:
        - video-loader.js

markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.md
  - node_modules
  - vendor
