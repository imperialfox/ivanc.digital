<footer class="site-footer">
  <p class="footer-line">
    &copy; {{ site.time | date: "%Y" }} ivanc.digital
    &middot; <a href="{{ site.data.links.instagram }}">Instagram</a>
    &middot; <a href="mailto:{{ site.data.links.email }}">Email</a>
  </p>
  <p class="footer-line footer-credit">
    Designed by Ivan
    &middot;
    <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="theme-switch-label" aria-hidden="true">Dark mode</span>
      <span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span>
    </button>
    {% comment %} Switched off: the old quiet dot that opened the System / Light / Dark panel.
    <button class="prefs-open" type="button" aria-label="Display preferences" aria-controls="prefs-panel" aria-expanded="false">&middot;</button>
    {% endcomment %}
  </p>
</footer>
